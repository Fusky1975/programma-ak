<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adventurer-Kings -- GM Interface{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <h1>&#9876; Adventurer-Kings &mdash; GM Interface</h1>
  </header>
  <div class="page">
    {% if error %}
      <div class="error-banner">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
